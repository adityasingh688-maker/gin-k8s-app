apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gin-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Uncomment when using cert-manager (see k8s/cert-manager-issuer.yaml)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gin-app.local        # change to your real domain in production
      secretName: gin-app-tls  # created manually (self-signed) or by cert-manager
  rules:
    - host: gin-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gin-app
                port:
                  number: 80
